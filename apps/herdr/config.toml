# Managed by ~/.dotfiles. Keep only settings that differ from Herdr defaults.

# Avoid first-run onboarding writing back into this tracked file.
onboarding = false

[keys]
prefix = "ctrl+a"

[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"
